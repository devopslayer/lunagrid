<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunagrid | 404 Not Found</title>
    <link rel="icon" type="image/svg+xml" href="./glide.svg" />
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
        background-color: #eee;
        color: #333;
      }

      .error-container {
        text-align: center;
        padding: 2rem;
        line-height: 1.5rem;
      }

      .error-container h1 {
        font-size: 2rem;
      }

      .error-container p {
        font-size: 1rem;
      }

      .error-container .home-link {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background-color: #007BFF;
        color: #fff;
        font-size: 1rem;
        text-decoration: none;
        border-radius: 5px;
        transition: background-color 0.3s ease;
      }

      .error-container .home-link:hover {
        background-color: #0056b3;
      }

      .error-image {
        max-width: 100%;
        height: auto;
        margin-bottom: 1.5rem;
      }

      .error-image img {
        width: 24%;
        height: 24%;
        object-fit: cover;
        border-radius: 8px;
        animation: scaleup 3s infinite alternate;
      }

      @keyframes scaleup {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(1.05);
        }
      }

      @media (max-width: 600px) {
        .error-container h1 {
          font-size: 1.5rem;
        }
        .error-container p {
          font-size: 0.9rem;
        }
        .error-image img {
          width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-image">
        <img src="./404_image.jpg" alt="404 Error" />
      </div>
      <h1>404 Not Found</h1>
      <p>The page you are looking for does not exist.</p>
      <a href="/lunagrid/" class="home-link">Go to Homepage</a>
    </div>
  </body>
</html>
